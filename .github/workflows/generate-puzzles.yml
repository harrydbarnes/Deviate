name: Freeze daily puzzle

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate actor catalogue
        run: npm run validate:data
      - name: Freeze today's puzzle
        run: npm run generate:today
      - name: Commit frozen data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet || git commit -m "chore: freeze daily puzzle"
          git push
