name: Deploy Deviate

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Freeze daily puzzle"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Pages configuration
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('enabled', 'false');
                core.warning('GitHub Pages is not enabled. Choose GitHub Actions under Settings > Pages, then rerun this workflow.');
              } else {
                throw error;
              }
            }
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Explain skipped deployment
        if: steps.pages.outputs.enabled != 'true'
        run: echo "GitHub Pages is not enabled yet; the site was not deployed."
